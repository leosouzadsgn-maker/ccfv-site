<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#020403"
    >

    <meta
        name="description"
        content="Ranking oficial Mobile da CCFV — jogadores, Elo e insígnias."
    >

    <title>
        Ranking Mobile — CCFV
    </title>


    <!-- =====================================================
         FONTES
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/header.css"
    >

    <link
        rel="stylesheet"
        href="../css/ranking.css"
    >

    <link
        rel="stylesheet"
        href="../css/mobile-competitions.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >


    <!-- =====================================================
         MOTOR DOS CARDS
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"
        defer
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
        defer
    ></script>

</head>


<body
    data-mobile-page="ranking"
>


    <!-- =====================================================
         HEADER
         MESMA BASE DO CCFV
         ===================================================== -->

    <header
        class="ccfv-header"
        id="site-header"
    >

        <div
            class="ccfv-header__inner"
        >

            <a
                href="mobile.html"
                class="ccfv-header__brand"
            >

                <img
                    src="../assets/images/logo/ccfv-logo.png"
                    alt="CCFV"
                    class="ccfv-header__logo"
                >

                <span
                    class="ccfv-header__brand-text"
                >

                    <span
                        class="ccfv-header__brand-name"
                    >
                        CCFV
                    </span>

                    <span
                        class="ccfv-header__brand-subtitle"
                    >
                        Confederação Coliseu de Futebol Virtual
                    </span>

                </span>

            </a>


            <nav
                class="ccfv-header__nav"
                aria-label="Navegação principal"
            >

                <a
                    href="../index.html"
                    class="ccfv-header__link"
                >
                    Início
                </a>

                <a
                    href="brasileirao.html"
                    class="ccfv-header__link"
                >
                    Brasileirão
                </a>

                <a
                    href="night.html"
                    class="ccfv-header__link"
                >
                    Night Cup
                </a>

                <a
                    href="mobile.html"
                    class="ccfv-header__link is-active"
                >
                    Mobile
                </a>

                <a
                    href="partidas.html"
                    class="ccfv-header__link"
                >
                    Partidas
                </a>

                <a
                    href="ranking.html"
                    class="ccfv-header__link"
                >
                    Ranking
                </a>

            </nav>


            <a
                href="mobile.html"
                class="ccfv-header__action"
            >
                Mobile
            </a>


            <button
                type="button"
                class="ccfv-header__menu"
                aria-label="Abrir menu"
                aria-expanded="false"
            >

                <span
                    class="ccfv-header__menu-lines"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main>


        <!-- =================================================
             HERO
             MESMA ESTRUTURA DO RANKING PC/CONSOLE
             ================================================= -->

        <section
            class="
                ccfv-ranking-hero
                ccfv-ranking-hero--mobile
            "
        >

            <div
                class="ccfv-ranking-hero__background"
                aria-hidden="true"
            >

                <div
                    class="ccfv-ranking-hero__glow"
                ></div>

                <div
                    class="ccfv-ranking-hero__grid"
                ></div>

                <div
                    class="ccfv-ranking-hero__scan"
                ></div>

            </div>


            <div
                class="ccfv-ranking-container"
            >

                <div
                    class="ccfv-ranking-hero__content"
                >

                    <div
                        class="ccfv-ranking-hero__eyebrow"
                    >

                        <span></span>

                        CCFV // MOBILE // OFFICIAL RANKING

                    </div>


                    <h1
                        class="ccfv-ranking-hero__title"
                    >

                        QUEM É O

                        <strong>
                            MELHOR?
                        </strong>

                    </h1>


                    <p
                        class="ccfv-ranking-hero__description"
                    >

                        O ranking oficial da CCFV reúne
                        os competidores Mobile,
                        seu Elo e sua evolução competitiva.

                    </p>

                </div>


                <!-- =================================================
                     ESTATÍSTICAS
                     ================================================= -->

                <div
                    class="ccfv-ranking-hero__stats"
                >

                    <div>

                        <span>
                            JOGADORES
                        </span>

                        <strong
                            id="mobile-ranking-count"
                        >
                            00
                        </strong>

                    </div>


                    <div>

                        <span>
                            TEMPORADA
                        </span>

                        <strong>
                            01
                        </strong>

                    </div>


                    <div>

                        <span>
                            RANKING
                        </span>

                        <strong>
                            MOBILE
                        </strong>

                    </div>

                </div>


                <!-- =================================================
                     LÍDER MOBILE
                     PREENCHIDO PELO mobile.js
                     ================================================= -->

                <div
                    id="mobile-ranking-hero-leader"
                    class="ccfv-ranking-hero__leader"
                ></div>

            </div>

        </section>



        <!-- =================================================
             CONTEÚDO DINÂMICO DO RANKING MOBILE
             O mobile.js monta:
             - TOP 10
             - LÍDER
             - NÍVEIS
             ================================================= -->

        <div
            id="mobile-ranking-content"
        ></div>


    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="../js/main.js"
        defer
    ></script>

    <script
        src="../js/mobile.js"
        defer
    ></script>


</body>

</html>
