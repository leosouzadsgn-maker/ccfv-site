<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#020403"
    >

    <meta
        name="description"
        content="Todos os competidores Mobile da CCFV — Ranking e Cards Oficiais."
    >

    <title>
        Competidores Mobile — CCFV
    </title>


    <!-- =====================================================
         FONTES
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/header.css"
    >

    <link
        rel="stylesheet"
        href="../css/ranking.css"
    >

    <link
        rel="stylesheet"
        href="../css/mobile-competitions.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >


    <!-- =====================================================
         MOTOR PARA GERAR CARD PNG
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"
        defer
    ></script>

    <script
        src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
        defer
    ></script>

</head>


<body
    data-mobile-page="jogadores"
>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header
        class="ccfv-header"
        id="site-header"
    >

        <div
            class="ccfv-header__inner"
        >


            <!-- BRAND -->

            <a
                href="mobile.html"
                class="ccfv-header__brand"
            >

                <img
                    src="../assets/images/logo/ccfv-logo.png"
                    alt="CCFV"
                    class="ccfv-header__logo"
                >

                <span
                    class="ccfv-header__brand-text"
                >

                    <span
                        class="ccfv-header__brand-name"
                    >
                        CCFV
                    </span>

                    <span
                        class="ccfv-header__brand-subtitle"
                    >
                        Confederação Coliseu de Futebol Virtual
                    </span>

                </span>

            </a>


            <!-- NAV -->

            <nav
                class="ccfv-header__nav"
                aria-label="Navegação principal"
            >

                <a
                    href="../index.html"
                    class="ccfv-header__link"
                >
                    Início
                </a>

                <a
                    href="brasileirao.html"
                    class="ccfv-header__link"
                >
                    Brasileirão
                </a>

                <a
                    href="night.html"
                    class="ccfv-header__link"
                >
                    Night Cup
                </a>

                <a
                    href="mobile.html"
                    class="ccfv-header__link is-active"
                >
                    Mobile
                </a>

                <a
                    href="partidas.html"
                    class="ccfv-header__link"
                >
                    Partidas
                </a>

                <a
                    href="ranking.html"
                    class="ccfv-header__link"
                >
                    Ranking
                </a>

            </nav>


            <!-- ACTION -->

            <a
                href="mobile.html"
                class="ccfv-header__action"
            >
                Mobile
            </a>


            <!-- MOBILE MENU -->

            <button
                type="button"
                class="ccfv-header__menu"
                aria-label="Abrir menu"
                aria-expanded="false"
            >

                <span
                    class="ccfv-header__menu-lines"
                >

                    <span></span>
                    <span></span>
                    <span></span>

                </span>

            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main>


        <!-- =================================================
             DIRECTORY
             ================================================= -->

        <section
            class="
                ccfv-mobile-section
                ccfv-mobile-section--soft
            "
        >

            <div
                class="ccfv-mobile-container"
            >

                <span
                    class="ccfv-mobile-kicker"
                >
                    CCFV // MOBILE // DIRECTORY
                </span>


                <h1
                    class="mobile-directory-title"
                >

                    TODOS OS

                    <br>

                    <strong>
                        COMPETIDORES.
                    </strong>

                </h1>


                <p
                    class="
                        ccfv-mobile-muted
                        mobile-directory-lead
                    "
                >

                    Todos os jogadores Mobile
                    cadastrados no CCFV.

                    Cada competidor possui
                    seu card oficial para
                    baixar e compartilhar.

                </p>



                <!-- =================================================
                     BUSCA
                     ================================================= -->

                <div
                    class="mobile-directory-toolbar"
                >

                    <label>

                        BUSCAR

                        <input
                            id="mobile-player-search"
                            type="search"
                            placeholder="Nome do jogador..."
                            autocomplete="off"
                        >

                    </label>


                    <strong
                        id="mobile-directory-count"
                    >
                        00 JOGADORES
                    </strong>

                </div>



                <!-- =================================================
                     CARDS DOS JOGADORES
                     O mobile.js preenche aqui
                     ================================================= -->

                <div
                    id="mobile-player-directory"
                ></div>


            </div>

        </section>

    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="../js/main.js"
        defer
    ></script>

    <script
        src="../js/mobile.js"
        defer
    ></script>


</body>

</html>
